<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GMGN 持仓观察验收页</title>
  <style>body{margin:0;background:#f6f7f9;color:#14171c;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.bar{height:72px;background:#fff;border-bottom:1px solid #e4e7eb;display:flex;align-items:center;padding:0 28px;gap:18px}.logo{font-weight:900;color:#18a85f}.token{font-size:25px;font-weight:850}.sub{color:#7b8490}.chart{height:560px;margin:24px;border:1px solid #e4e7eb;background:linear-gradient(#fff,#fafafa);display:grid;place-items:center;color:#a1a8b2}.remount{position:fixed;bottom:24px;left:24px;padding:10px 14px}</style>
</head>
<body>
  <div class="bar"><span class="logo">GMGN</span><span class="token">DEMO</span><span class="sub">0x11…1111</span></div>
  <div class="chart">模拟 GMGN 代币页</div>
  <button class="remount">模拟页面局部刷新</button>
  <script>
    history.replaceState({}, "", "/bsc/token/0x1111111111111111111111111111111111111111");
    window.__GWH_TEST__ = {
      runtime: { sendMessage: async () => ({ ok: true, data: { configured: true, checkedAt: Date.now(), wallets: [
        { id: "1", label: "阿峰", address: "0x2222222222222222222222222222222222222222", hasBalance: true, amount: "12345678.9", percentage: "1.2345" },
        { id: "2", label: "观察二号", address: "0x3333333333333333333333333333333333333333", hasBalance: false, amount: "0", percentage: "0" }
      ] } }) },
      storage: {
        local: {
          async get(key) { return { [key]: JSON.parse(localStorage.getItem(key) || "null") }; },
          async set(items) { Object.entries(items).forEach(([key, value]) => localStorage.setItem(key, JSON.stringify(value))); }
        },
        onChanged: { addListener() {} }
      }
    };
    document.querySelector(".remount").addEventListener("click", () => {
      const bar = document.querySelector(".bar");
      bar.replaceWith(bar.cloneNode(true));
    });
  </script>
  <script src="/content.js"></script>
</body>
</html>
